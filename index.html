<!-- Application Script -->
    <script>
        // Supabase Credentials
        const SUPABASE_URL = 'https://wnmwajgamudpmwsylznl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndubXdhamdhbXVkcG13c3lsem5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzY4NjUsImV4cCI6MjEwMDkxMjg2NX0.XA25lWUiks5r6M8Vw4-65BckwCYnxz9OOD3663mlb2g';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Standard sizing mappings based on item category
        const CATEGORY_SIZES = {
            "Shoes": ["38", "39", "40", "41", "42", "43", "44", "45", "46"],
            "Apparel": ["S", "M", "L", "XL", "XXL"],
            "Bags": ["Standard / One Size"],
            "Watches": ["Standard / One Size"],
            "Accessories": ["Standard / One Size"],
            "Perfumes": ["100ml EDP"]
        };

        // Fallback static items if Supabase table is empty or offline
        const fallbackProducts = [
            {
                id: 1,
                name: "Unisex Royal Calfskin Tote",
                category: "Bags",
                price: 85000,
                image_url: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?q=80&w=800&auto=format&fit=crop",
                badge: "Unisex Best Seller",
                description: "Handcrafted full-grain unisex tote designed for both business and leisure travel."
            },
            {
                id: 2,
                name: "Prestige Chronograph Gold Watch",
                category: "Watches",
                price: 145000,
                image_url: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?q=80&w=800&auto=format&fit=crop",
                badge: "Unisex Classic",
                description: "Automatic motion timepiece featuring sapphire crystal glass."
            },
            {
                id: 3,
                name: "Unisex Luxury Italian Leather Loafers",
                category: "Shoes",
                price: 72000,
                image_url: "https://images.unsplash.com/photo-1552346154-21d32810aba3?q=80&w=800&auto=format&fit=crop",
                badge: "New Arrival",
                description: "Premium handcrafted unisex footwear engineered for elegance and maximum comfort."
            },
            {
                id: 4,
                name: "Bespoke Tailored Blazer",
                category: "Apparel",
                price: 92000,
                image_url: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?q=80&w=800&auto=format&fit=crop",
                badge: "Haute Couture",
                description: "Custom-cut structured blazer tailored for men and women."
            },
            {
                id: 5,
                name: "Oversized Gold Aviator Sunglasses",
                category: "Accessories",
                price: 32000,
                image_url: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?q=80&w=800&auto=format&fit=crop",
                badge: "Trending",
                description: "UV400 protective unisex designer sunglasses."
            },
            {
                id: 6,
                name: "Imperial Oud Perfume Extract",
                category: "Perfumes",
                price: 48000,
                image_url: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=800&auto=format&fit=crop",
                badge: "Unisex Fragrance",
                description: "Rich blend of rare Amber, Cambodian Oud, and Spices."
            }
        ];

        let products = [];
        const categories = ["All", "Bags", "Shoes", "Watches", "Apparel", "Accessories", "Perfumes"];
        let activeCategory = "All";
        let searchQuery = "";
        let selectedModalSize = null;
        let toastTimeout = null;
        
        let cart = JSON.parse(localStorage.getItem('wumans_luxury_cart')) || [];

        // DOM References
        let productsGrid, filterButtonsContainer, categoryPillsContainer, productCount;
        let cartBtn, cartModal, cartOverlay, closeCart, cartBadge, cartItemsContainer;
        let cartSubtotal, cartShipping, cartTotal, deliverySelect, checkoutBtn;
        let productModal, productModalOverlay, closeProductModal, productModalBody;

        document.addEventListener('DOMContentLoaded', async () => {
            initDOM();
            renderFilterButtons();
            renderCategoryPills();
            setupEventListeners();
            
            await fetchProductsFromSupabase();
            renderProducts();
            updateCartUI();
        });

        function initDOM() {
            productsGrid = document.getElementById('products-grid');
            filterButtonsContainer = document.getElementById('category-filter-buttons');
            categoryPillsContainer = document.getElementById('category-pills');
            productCount = document.getElementById('product-count');

            cartBtn = document.getElementById('cart-btn');
            cartModal = document.getElementById('cart-modal');
            cartOverlay = document.getElementById('cart-overlay');
            closeCart = document.getElementById('close-cart');
            cartBadge = document.getElementById('cart-badge');
            cartItemsContainer = document.getElementById('cart-items-container');
            cartSubtotal = document.getElementById('cart-subtotal');
            cartShipping = document.getElementById('cart-shipping');
            cartTotal = document.getElementById('cart-total');
            deliverySelect = document.getElementById('delivery-location');
            checkoutBtn = document.getElementById('checkout-btn');

            productModal = document.getElementById('product-modal');
            productModalOverlay = document.getElementById('product-modal-overlay');
            closeProductModal = document.getElementById('close-product-modal');
            productModalBody = document.getElementById('product-modal-body');
        }

        async function fetchProductsFromSupabase() {
            try {
                // Fetching from your Supabase Products table matching columns: name, category, price, description, image_url
                const { data, error } = await supabaseClient.from('Products').select('*');
                if (error || !data || data.length === 0) {
                    products = fallbackProducts;
                } else {
                    products = data.map(item => ({
                        id: item.id,
                        name: item.name,
                        category: item.category || 'Apparel',
                        price: item.price,
                        image: item.image_url || "https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=800&auto=format&fit=crop",
                        badge: "Luxury Item",
                        description: item.description || "Exclusive piece from WUMANS_LUXURY collection."
                    }));
                }
            } catch (err) {
                console.error('Using fallback products due to fetch error:', err.message);
                products = fallbackProducts;
            }
        }

        function showToast(title, message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-message').innerText = message;

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-10');
            toast.classList.add('opacity-100', 'translate-y-0');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-10');
            }, 3000);
        }

        function handleImageError(img) {
            img.onerror = null;
            img.src = 'https://via.placeholder.com/600x600/1C1C1C/D4AF37?text=Wumans+Luxury';
        }

        function renderFilterButtons() {
            filterButtonsContainer.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider transition-all ${activeCategory === cat ? 'bg-gold text-black shadow-lg' : 'bg-onyx text-gray-300 hover:text-gold border border-white/10'}">
                    ${cat}
                </button>
            `).join('');
        }

        function renderCategoryPills() {
            const catImages = {
                "Bags": "https://images.unsplash.com/photo-1584917865442-de89df76afd3?q=80&w=400&auto=format&fit=crop",
                "Shoes": "https://images.unsplash.com/photo-1552346154-21d32810aba3?q=80&w=400&auto=format&fit=crop",
                "Watches": "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?q=80&w=400&auto=format&fit=crop",
                "Apparel": "https://images.unsplash.com/photo-1507679799987-c73779587ccf?q=80&w=400&auto=format&fit=crop",
                "Accessories": "https://images.unsplash.com/photo-1511499767150-a48a237f0083?q=80&w=400&auto=format&fit=crop",
                "Perfumes": "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=400&auto=format&fit=crop"
            };

            const displayCats = categories.filter(c => c !== "All");
            categoryPillsContainer.innerHTML = displayCats.map(cat => `
                <div onclick="setCategory('${cat}');" class="group cursor-pointer bg-luxuryGray border border-white/10 rounded-2xl p-4 text-center hover:border-gold transition-all hover:scale-105 shadow-lg">
                    <div class="w-16 h-16 mx-auto rounded-full overflow-hidden mb-3 border border-gold/30 group-hover:border-gold">
                        <img src="${catImages[cat]}" onerror="handleImageError(this)" alt="${cat}" loading="lazy" class="w-full h-full object-cover group-hover:scale-110 transition-transform">
                    </div>
                    <h4 class="font-semibold text-xs text-white uppercase tracking-wider group-hover:text-gold">${cat}</h4>
                </div>
            `).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderFilterButtons();
            renderProducts();
        }

        function renderProducts() {
            let filtered = products.filter(p => {
                const matchesCat = activeCategory === "All" || p.category === activeCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            productCount.innerText = filtered.length;

            if (filtered.length === 0) {
                productsGrid.innerHTML = `
                    <div class="col-span-full text-center py-12 space-y-3">
                        <i class="fa-solid fa-box-open text-gray-600 text-4xl"></i>
                        <p class="text-gray-400 text-sm">No items found matching your search.</p>
                    </div>
                `;
                return;
            }

            productsGrid.innerHTML = filtered.map(product => {
                const availableSizes = CATEGORY_SIZES[product.category] || ["Standard"];
                const sizeOptionsHtml = availableSizes.map(s => `<option value="${s}">${s}</option>`).join('');

                return `
                <div class="group bg-luxuryGray border border-white/10 rounded-2xl overflow-hidden hover:border-gold/50 transition-all duration-300 flex flex-col justify-between shadow-xl">
                    <div class="relative overflow-hidden aspect-square cursor-pointer" onclick="openProductModal(${product.id})">
                        <span class="absolute top-3 left-3 z-10 bg-onyx/80 backdrop-blur-md border border-gold/40 text-gold text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
                            ${product.badge || 'Luxury'}
                        </span>
                        <img src="${product.image}" onerror="handleImageError(this)" alt="${product.name}" loading="lazy" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                    </div>

                    <div class="p-5 space-y-3 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-[10px] uppercase text-gray-400 tracking-widest font-semibold">${product.category}</span>
                            <h3 onclick="openProductModal(${product.id})" class="font-serif font-bold text-lg text-white group-hover:text-gold transition-colors line-clamp-1 cursor-pointer">${product.name}</h3>
                        </div>

                        <!-- Card Inline Size Selector -->
                        <div class="pt-2">
                            <label class="block text-[10px] text-gray-400 uppercase tracking-widest mb-1">Select Size:</label>
                            <select id="card-size-${product.id}" class="w-full bg-onyx text-xs text-gold border border-white/10 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-gold">
                                ${sizeOptionsHtml}
                            </select>
                        </div>

                        <div class="flex items-center justify-between pt-3 border-t border-white/5">
                            <span class="font-serif font-bold text-lg text-gold">₦${Number(product.price).toLocaleString()}</span>
                            <div class="flex items-center space-x-2">
                                <button onclick="openProductModal(${product.id})" class="px-3 py-2 bg-luxuryGray text-gray-300 hover:text-gold border border-white/10 rounded-full text-xs font-semibold uppercase tracking-wider transition-all" title="Quick View">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                                <button onclick="addFromCard(${product.id})" class="px-4 py-2 bg-onyx border border-gold/40 hover:bg-gold hover:text-black text-gold rounded-full text-xs font-semibold uppercase tracking-wider transition-all">
                                    Add
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        function selectModalSizeBtn(sizeBtn, sizeValue) {
            document.querySelectorAll('.modal-size-pill').forEach(btn => {
                btn.classList.remove('bg-gold', 'text-black', 'border-gold');
                btn.classList.add('bg-onyx', 'text-gray-300', 'border-white/10');
            });

            sizeBtn.classList.remove('bg-onyx', 'text-gray-300', 'border-white/10');
            sizeBtn.classList.add('bg-gold', 'text-black', 'border-gold');
            selectedModalSize = sizeValue;
        }

        function openProductModal(id) {
            const p = products.find(item => item.id == id);
            if (!p) return;

            const sizes = CATEGORY_SIZES[p.category] || ["Standard"];
            selectedModalSize = sizes[0]; 

            const sizeButtonsHtml = sizes.map((s, idx) => `
                <button type="button" onclick="selectModalSizeBtn(this, '${s}')" class="modal-size-pill px-3 py-1.5 rounded-lg text-xs font-bold transition-all border ${idx === 0 ? 'bg-gold text-black border-gold' : 'bg-onyx text-gray-300 border-white/10 hover:border-gold'}">
                    ${s}
                </button>
            `).join('');

            productModalBody.innerHTML = `
                <div class="aspect-square rounded-2xl overflow-hidden border border-gold/30">
                    <img src="${p.image}" onerror="handleImageError(this)" alt="${p.name}" class="w-full h-full object-cover">
                </div>
                <div class="space-y-4">
                    <span class="bg-onyx border border-gold/40 text-gold text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider inline-block">
                        ${p.badge || 'Luxury'}
                    </span>
                    <h3 class="font-serif text-2xl font-bold text-white">${p.name}</h3>
                    <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">${p.category}</p>
                    <p class="text-sm text-gray-300 leading-relaxed font-light">${p.description || ''}</p>
                    
                    <div>
                        <span class="block text-xs uppercase tracking-widest text-gold font-bold mb-2">Available Size:</span>
                        <div class="flex flex-wrap gap-2">
                            ${sizeButtonsHtml}
                        </div>
                    </div>

                    <div class="text-2xl font-serif font-bold text-gold pt-2">₦${Number(p.price).toLocaleString()}</div>
                    <button onclick="addToCartModal(${p.id}); closeProductModalFunc();" class="w-full py-3.5 bg-gradient-to-r from-gold to-gold-dark text-black font-bold uppercase text-xs tracking-widest rounded-full hover:shadow-[0_0_20px_rgba(212,175,55,0.4)] transition-all flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span>Add To Bag</span>
                    </button>
                </div>
            `;
            productModal.classList.remove('hidden');
        }

        function closeProductModalFunc() {
            productModal.classList.add('hidden');
        }

        function addFromCard(id) {
            const p = products.find(item => item.id == id);
            const sizeSelect = document.getElementById(`card-size-${id}`);
            const chosenSize = sizeSelect ? sizeSelect.value : "Standard";
            addToCartAction(p, chosenSize);
        }

        function addToCartModal(id) {
            const p = products.find(item => item.id == id);
            addToCartAction(p, selectedModalSize || "Standard");
        }

        function addToCartAction(product, size) {
            const existingIndex = cart.findIndex(item => item.id === product.id && item.size === size);
            if (existingIndex > -1) {
                cart[existingIndex].quantity += 1;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    category: product.category,
                    size: size,
                    quantity: 1
                });
            }
            saveCart();
            updateCartUI();
            showToast("Added to Bag", `${product.name} (${size}) successfully added.`);
        }

        function saveCart() {
            localStorage.setItem('wumans_luxury_cart', JSON.stringify(cart));
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartBadge.innerText = totalCount;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="text-center py-16 space-y-3 text-gray-400">
                        <i class="fa-solid fa-bag-shopping text-4xl text-gray-600"></i>
                        <p class="text-sm">Your shopping bag is empty.</p>
                    </div>
                `;
            } else {
                cartItemsContainer.innerHTML = cart.map((item, index) => `
                    <div class="flex items-center space-x-4 bg-onyx p-3 rounded-2xl border border-white/5">
                        <img src="${item.image}" onerror="handleImageError(this)" alt="${item.name}" class="w-16 h-16 object-cover rounded-xl border border-gold/20">
                        <div class="flex-1">
                            <h4 class="font-serif font-bold text-sm text-white line-clamp-1">${item.name}</h4>
                            <p class="text-[10px] text-gold uppercase tracking-wider">Size: ${item.size}</p>
                            <p class="text-xs font-bold text-white mt-1">₦${Number(item.price).toLocaleString()}</p>
                            
                            <div class="flex items-center space-x-3 mt-2">
                                <button onclick="updateQty(${index}, -1)" class="w-6 h-6 bg-luxuryGray text-gray-300 rounded-lg hover:text-gold flex items-center justify-center text-xs">-</button>
                                <span class="text-xs font-bold">${item.quantity}</span>
                                <button onclick="updateQty(${index}, 1)" class="w-6 h-6 bg-luxuryGray text-gray-300 rounded-lg hover:text-gold flex items-center justify-center text-xs">+</button>
                            </div>
                        </div>
                        <button onclick="removeItem(${index})" class="text-gray-500 hover:text-red-400 text-sm p-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('');
            }

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shippingFee = Number(deliverySelect.value);
            const total = subtotal + (cart.length > 0 ? shippingFee : 0);

            cartSubtotal.innerText = `₦${subtotal.toLocaleString()}`;
            cartShipping.innerText = `₦${shippingFee.toLocaleString()}`;
            cartTotal.innerText = `₦${total.toLocaleString()}`;
        }

        function updateQty(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            saveCart();
            updateCartUI();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            saveCart();
            updateCartUI();
        }

        function setupEventListeners() {
            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                document.getElementById('mobile-menu').classList.remove('hidden');
            });
            document.getElementById('close-mobile-menu').addEventListener('click', () => {
                document.getElementById('mobile-menu').classList.add('hidden');
            });
            document.querySelectorAll('.mobile-nav-link').forEach(link => {
                link.addEventListener('click', () => {
                    document.getElementById('mobile-menu').classList.add('hidden');
                });
            });

            document.getElementById('search-btn').addEventListener('click', () => {
                const drawer = document.getElementById('search-drawer');
                drawer.classList.toggle('hidden');
                if(!drawer.classList.contains('hidden')) {
                    document.getElementById('search-input').focus();
                }
            });
            document.getElementById('close-search').addEventListener('click', () => {
                document.getElementById('search-drawer').classList.add('hidden');
            });
            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderProducts();
            });

            cartBtn.addEventListener('click', () => {
                cartModal.classList.remove('hidden');
            });
            cartOverlay.addEventListener('click', () => {
                cartModal.classList.add('hidden');
            });
            closeCart.addEventListener('click', () => {
                cartModal.classList.add('hidden');
            });

            productModalOverlay.addEventListener('click', closeProductModalFunc);
            closeProductModal.addEventListener('click', closeProductModalFunc);

            deliverySelect.addEventListener('change', updateCartUI);

            checkoutBtn.addEventListener('click', () => {
                if (cart.length === 0) {
                    showToast("Empty Bag", "Please add items to your bag before checking out.");
                    return;
                }

                const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const shippingFee = Number(deliverySelect.value);
                const total = subtotal + shippingFee;
                const locationText = deliverySelect.options[deliverySelect.selectedIndex].text;

                let message = `✨ *NEW WUMANS_LUXURY ORDER* ✨\n\n`;
                cart.forEach((item, idx) => {
                    message += `${idx + 1}. *${item.name}*\n   Size: ${item.size} | Qty: ${item.quantity} | Price: ₦${(item.price * item.quantity).toLocaleString()}\n\n`;
                });

                message += `------------------------\n`;
                message += `Subtotal: ₦${subtotal.toLocaleString()}\n`;
                message += `Delivery Destination: ${locationText}\n`;
                message += `*Total Amount Due: ₦${total.toLocaleString()}*\n`;
                message += `------------------------\n`;
                message += `Please confirm availability and account details for payment.`;

                const encodedMessage = encodeURIComponent(message);
                const whatsappUrl = `https://wa.me/2348123340046?text=${encodedMessage}`;
                window.open(whatsappUrl, '_blank');
            });
        }
    </script>
